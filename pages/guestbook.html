<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방명록 | 말레이시아 선교 박람회</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<div id="toast" class="toast">
    🎉 응원메시지가 등록되었습니다!<br>
    감사합니다 😊
</div>

<section class="hero">

    <h1>Guestbook</h1>

    <p>방명록</p>

</section>

<section class="guestbook-section">

    <h1>방명록</h1>

    <p class="guestbook-subtitle">
        말레이시아 선교를 위한 응원의 한마디를 남겨주세요.
    </p>

    <div class="guestbook-form">

        <input
            type="text"
            id="name"
            placeholder="이름">

        <textarea
            id="message"
            rows="5"
            placeholder="응원메시지를 입력해주세요."></textarea>

        <button id="submitBtn">
            등록하기
        </button>

    </div>

    <hr>

    <h2>응원메시지</h2>

    <div id="guestbook-list">

        <p style="text-align:center;color:gray;">
            아직 등록된 메시지가 없습니다.
        </p>

    </div>

</section>

<footer id="footerAdmin">

© 2026 Malaysia Mission Exhibition

</footer>

<script type="module" src="../guestbook.js"></script>

</body>
</html>
