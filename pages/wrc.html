<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRC Booth Exhibition</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
    margin:0;
    background:#eef3fb;
    font-family:'Paperlogy',sans-serif;
}

.hero{

    background:url("../images/hero/photozone.jpg") center center/cover no-repeat;

    min-height:45vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    position:relative;

}

.hero::before{

    content:"";

    position:absolute;

    inset:0;

    background:linear-gradient(
        rgba(0,0,0,.55),
        rgba(0,0,0,.45)
    );

}

.hero h1{

    margin:0;
    font-size:54px;
    color:#f7d774;
    text-shadow:3px 3px 15px rgba(0,0,0,.45);
    position:relative;
    z-index:1;

}

.hero p{

    margin-top:15px;
    font-size:20px;
    color:white;

    position:relative;
    z-index:1;

}

.container{

    width:92%;
    max-width:1200px;
    margin:auto;
    padding:60px 0;

}

.section{

    margin-bottom:90px;

}

.section h2{

    text-align:center;
    color:#0b3d91;
    font-size:34px;
    margin-bottom:35px;

}

.banner{

    width:100%;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
    transition:.35s;

}

.banner:hover{

    transform:translateY(-8px);

}

.back{

    display:inline-block;
    margin:50px auto;
    padding:14px 30px;
    background:#0b3d91;
    color:white;
    text-decoration:none;
    border-radius:40px;
    transition:.3s;

}

.back:hover{

    background:#082c69;

}

.footer{

    text-align:center;

}

@media(max-width:768px){

.hero{

    min-height:35vh;

}

.hero h1{

    font-size:36px;

}

.hero p{

    font-size:16px;

}

.section h2{

font-size:24px;

}

}

</style>

</head>

<body>

<section class="hero">

<h1>WRC Booth Exhibition</h1>

<p>말레이시아 살린 영적황제</p>

</section>

<div class="container">

<div class="section">

<h2>① 눈에 안 보이는 황제</h2>

<img src="../images/banners/banner1.jpg" class="banner" alt="현수막1">

</div>

<div class="section">

<h2>② 말레이시아 Malaysia</h2>

<img src="../images/banners/banner2.jpg" class="banner" alt="현수막2">

</div>

<div class="section">

<h2>③ 말레이시아 살린 영적 황제</h2>

<img src="../images/banners/banner3.jpg" class="banner" alt="현수막3">

</div>

<div class="footer">

<a class="back" href="../index.html">
← 메인으로 돌아가기
</a>

</div>

</div>

</body>
</html>
